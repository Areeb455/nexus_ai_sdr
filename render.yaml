services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: nexus-sdr-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-sdr-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_AI_PROVIDER
        value: heuristic
      - key: CORS_ORIGINS
        value: "*"

  # 2. Next.js Frontend Web Service
  - type: web
    name: nexus-sdr-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://nexus-sdr-backend.onrender.com/api/v1

# 3. PostgreSQL Database
databases:
  - name: nexus-sdr-postgres
    databaseName: nexus_sdr
    user: nexus_admin
    plan: free
